<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Yasumi{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --yasumi-red: #c0392b; --yasumi-dark: #1a1a1a; --yasumi-sidebar: #111111; }
    body { background: #f5f5f5; font-family: 'Segoe UI', sans-serif; }
    .sidebar { min-height: 100vh; width: 220px; min-width: 220px; background: var(--yasumi-sidebar); display: flex; flex-direction: column; }
    .sidebar .brand { padding: 20px 16px; border-bottom: 2px solid var(--yasumi-red); text-align: center; }
    .sidebar .brand-name { color: #fff; font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; }
    .sidebar .brand-sub { color: #aaa; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }
    .sidebar a { color: #bbb; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: 0.9rem; transition: all 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: #222; color: #fff; border-left: 3px solid var(--yasumi-red); }
    .main-content { flex: 1; padding: 28px 32px; }
    .stat-card { border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn-yasumi { background: var(--yasumi-red); color: #fff; border: none; }
    .btn-yasumi:hover { background: #a93226; color: #fff; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-radius: 10px; }
    .card-header { background: #fff; font-weight: 600; border-bottom: 2px solid #f0f0f0; }
    .table thead th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }
  </style>
</head>
<body>
<div class="d-flex">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-name">休み</div>
      <div class="brand-sub">Yasumi · Japanese</div>
    </div>
    <a href="/"         class="{% block nav_dash %}{% endblock %}">    <i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/tables/"  class="{% block nav_tables %}{% endblock %}">  <i class="bi bi-grid-3x3-gap"></i> Tables</a>
    <a href="/menu/"    class="{% block nav_menu %}{% endblock %}">    <i class="bi bi-journal-text"></i> Menu</a>
    <a href="/orders/"  class="{% block nav_orders %}{% endblock %}">  <i class="bi bi-receipt"></i> Orders</a>
    <a href="/billing/" class="{% block nav_billing %}{% endblock %}"> <i class="bi bi-cash-coin"></i> Billing</a>
    <div style="flex:1"></div>
    <a href="/admin/"><i class="bi bi-gear"></i> Admin</a>
  </div>
  <div class="main-content">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3">
          {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
