{% extends 'base.html' %}
{% block title %}{% if item %}Edit{% else %}Add{% endif %} Item{% endblock %}
{% block nav_menu %}active{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:500px">
  <div class="card-header fw-bold">{% if item %}Edit{% else %}Add{% endif %} Menu Item</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ item.name|default:'' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select" required>
          {% for cat in categories %}
          <option value="{{ cat.pk }}" {% if item.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Price (Rs.)</label>
        <input name="price" type="number" step="0.01" class="form-control" value="{{ item.price|default:'' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ item.description|default:'' }}</textarea>
      </div>
      <div class="mb-3 form-check">
        <input name="is_available" type="checkbox" class="form-check-input" id="avail" {% if item.is_available or not item %}checked{% endif %}>
        <label class="form-check-label" for="avail">Available</label>
      </div>
      <button class="btn btn-primary w-100">Save</button>
    </form>
  </div>
</div>
{% endblock %}
