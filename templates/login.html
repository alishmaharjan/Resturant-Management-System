<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · 休み Yasumi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --torii:  #c0392b;
      --sumi:   #0a0a0a;
      --panel:  #141414;
      --border: #2a2a2a;
      --cream:  #f0ece4;
      --silver: #909090;
      --mist:   #525252;
    }

    body {
      background: var(--sumi);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
    }

    .login-wrap {
      width: 100%;
      max-width: 390px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* ── Branding ── */
    .brand-block {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand-line::before,
    .brand-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(192,57,43,0.45));
    }

    .brand-line::after {
      background: linear-gradient(to left, transparent, rgba(192,57,43,0.45));
    }

    .brand-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 3.8rem;
      font-weight: 600;
      color: var(--torii);
      line-height: 1;
      letter-spacing: 4px;
      text-shadow:
        0 0 40px rgba(192,57,43,0.25),
        0 2px 8px rgba(0,0,0,0.6);
      display: block;
    }

    .brand-romaji {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ffffff;
      margin-top: 8px;
      font-weight: 700;
    }

    .brand-sub {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--silver);
      margin-top: 6px;
    }

    /* ── Card ── */
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 4px solid var(--torii);
      border-radius: 3px;
      padding: 32px 32px 30px;
      position: relative;
    }

    /* ── Error ── */
    .error-box {
      background: rgba(192,57,43,0.07);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 3px;
      color: #ff8888;
      padding: 10px 14px;
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 22px;
      letter-spacing: 0.2px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      background: #0a0a14;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--cream);
      padding: 11px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--torii);
      background: #0d0d18;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
    }

    .form-input::placeholder { color: var(--mist); }

    /* ── Submit ── */
    .btn-enter {
      width: 100%;
      background: var(--torii);
      border: none;
      border-radius: 3px;
      color: #fff;
      padding: 13px;
      font-family: 'Noto Sans JP', inherit;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }

    .btn-enter:hover { background: #a5251e; }
    .btn-enter:active { background: #8e1e18; }

    /* ── Footer ── */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      color: var(--mist);
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }

    .login-footer span {
      display: inline-block;
      margin: 0 6px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="brand-block">
      <div class="brand-line">
        <span class="brand-kanji">休み</span>
      </div>
      <span class="brand-romaji">Yasumi</span>
      <span class="brand-sub">Japanese Restaurant Management</span>
    </div>

    <div class="login-card">
      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input id="id_username" type="text" name="username"
                 class="form-input" placeholder="Enter username" autofocus required>
        </div>
        <div class="form-group" style="margin-bottom:26px;">
          <label class="form-label" for="id_password">Password</label>
          <input id="id_password" type="password" name="password"
                 class="form-input" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-enter">Sign In &nbsp;→</button>
      </form>
    </div>

    <div class="login-footer">
      <span>休み Yasumi</span>
      <span>·</span>
      <span>Restaurant Management System</span>
    </div>

  </div>
</body>
</html>
