<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Yasumi</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="shortcut icon" href="/static/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+JP:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #c0392b;
      --red-d:  #9b2335;
      --black:  #000000;
      --bg:     #0e0e0e;
      --card:   #161616;
      --border: #2a2a2a;
      --white:  #ffffff;
      --silver: #c0c0c0;
      --dim:    #a0a0a0;
      --border: #383838;
    }

    body {
      background: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    /* ── Logo block ── */
    .logo-block {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-circle {
      width: 96px;
      height: 96px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow:
        0 0 0 6px rgba(192,57,43,0.12),
        0 0 0 12px rgba(192,57,43,0.06),
        0 8px 32px rgba(192,57,43,0.4);
    }

    .logo-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 2.6rem;
      font-weight: 600;
      color: #fff;
      line-height: 1;
      letter-spacing: 2px;
    }

    .logo-name {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--white);
      letter-spacing: 6px;
      text-transform: uppercase;
      display: block;
    }

    .logo-sub {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--silver);
      margin-top: 6px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border));
    }
    .divider::after {
      background: linear-gradient(to left, transparent, var(--border));
    }

    /* ── Card ── */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: 6px;
      padding: 30px 28px 26px;
    }

    /* ── Error ── */
    .error-box {
      background: rgba(192,57,43,0.08);
      border: 1px solid rgba(192,57,43,0.35);
      color: #ff8888;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── Form ── */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #111;
      border: 1px solid #484848;
      border-radius: 4px;
      color: var(--white);
      padding: 11px 13px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      color-scheme: dark;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--red);
      background: #151515;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.15);
    }

    .field input::placeholder { color: #686868; }

    .btn-login {
      width: 100%;
      background: var(--red);
      border: none;
      border-radius: 4px;
      color: #fff;
      padding: 12px;
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 6px;
    }
    .btn-login:hover { background: var(--red-d); }
    .btn-login:active { background: #861e16; }

    .footer-text {
      text-align: center;
      color: #666666;
      font-size: 0.62rem;
      letter-spacing: 2px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="logo-block">
      <img src="/static/images/logo.png" alt="Yasumi"
           style="width:120px;height:120px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 14px;">
      <span class="logo-name">Yasumi</span>
      <span class="logo-sub">Japanese Restaurant</span>
    </div>

    <div class="divider"></div>

    <div class="login-card">
      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="field">
          <label for="id_username">Username</label>
          <input id="id_username" type="text" name="username"
                 placeholder="Enter username" autofocus required>
        </div>
        <div class="field" style="margin-bottom:22px;">
          <label for="id_password">Password</label>
          <input id="id_password" type="password" name="password"
                 placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>

    <div class="footer-text">Yasumi · Restaurant Management System</div>
  </div>
</body>
</html>
