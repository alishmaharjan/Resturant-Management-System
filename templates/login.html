<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Yasumi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#111; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { background:#1a1a1a; border:1px solid #333; border-radius:16px; padding:40px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .brand-name { color:#c0392b; font-size:2.5rem; font-weight:900; letter-spacing:4px; text-align:center; }
    .brand-sub { color:#888; font-size:0.75rem; letter-spacing:4px; text-transform:uppercase; text-align:center; margin-bottom:32px; }
    .form-control { background:#222; border:1px solid #444; color:#fff; padding:12px 16px; border-radius:8px; }
    .form-control:focus { background:#2a2a2a; border-color:#c0392b; color:#fff; box-shadow:0 0 0 3px rgba(192,57,43,0.2); }
    .form-label { color:#aaa; font-size:0.85rem; }
    .btn-login { background:#c0392b; border:none; color:#fff; font-weight:700; padding:12px; border-radius:8px; width:100%; font-size:1rem; letter-spacing:1px; transition:background 0.2s; }
    .btn-login:hover { background:#a93226; color:#fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-name">休み</div>
    <div class="brand-sub">Yasumi Japanese Restaurant</div>
    {% if error %}
    <div class="alert py-2 text-center mb-3" style="background:#2a0a0a;border:1px solid #c0392b;color:#ff6b6b;border-radius:8px;">
      {{ error }}
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">LOGIN</button>
    </form>
  </div>
</body>
</html>
